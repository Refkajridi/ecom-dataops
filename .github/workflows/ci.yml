name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DUCKDB_PATH: ${{ github.workspace }}/data/ci.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Tests pytest et contrats
        run: pytest -q
      - name: Ingestion
        run: python ingestion/ingest.py
      - name: dbt build
        working-directory: dbt_project
        run: |
          dbt source freshness --profiles-dir .
          dbt build --profiles-dir .